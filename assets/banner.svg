<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
        fill: url(#primaryGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .dash-anim {
        stroke-dasharray: 6 6;
        animation: dash 25s linear infinite;
      }
      .float-pill-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .float-pill-3 {
        animation: float3 8s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.96); }
        100% { opacity: 0.65; transform: scale(1.04); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Deep Background) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1020" cy="320" r="220" fill="url(#glowGrad2)" filter="url(#glow)" class="pulse-circle" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Tech Circuit Lines (Background Behind Cards & Text) -->
  <g opacity="0.35" class="dash-anim">
    <path d="M 50 80 Q 250 80 350 160 T 650 160 T 950 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 50 340 Q 250 340 380 280 T 700 280 T 1000 340 T 1150 340" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <path d="M 120 400 L 120 20 L 140 20" fill="none" stroke="#6366f1" stroke-width="1" />
    <path d="M 1080 20 L 1080 400 L 1060 400" fill="none" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Central Ambient Card Shield (Ensuring text contrast & readability) -->
  <rect x="100" y="45" width="1000" height="235" rx="20" fill="#0b1120" fill-opacity="0.75" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardGlow)" />

  <!-- Header Badge Pill -->
  <g transform="translate(460, 68)">
    <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" class="badge-text" fill="#38bdf8" font-size="12">ENTERPRISE SANDBOX ECOSYSTEM</text>
  </g>

  <!-- Title & Subtitle (Crisp Foreground, 100% Unobscured) -->
  <text x="600" y="152" text-anchor="middle" class="title-text" filter="url(#glow)">Awesome Demo &amp; Sandbox Environments</text>
  <text x="600" y="196" text-anchor="middle" class="subtitle-text">Curated Ephemeral Preview Environments • Isolated Sandboxes • EaaS Orchestration</text>
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b" font-weight="500">Accelerating QA Testing • Instant PR Previews • Live Sales Demos • Zero Staging Bottlenecks</text>

  <!-- Interactive Dynamic Floating Feature Cards / Pills (Lower Half) -->
  <!-- Pill 1: Ephemeral PR Previews -->
  <g class="float-pill-1" transform="translate(130, 310)">
    <rect width="210" height="64" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle cx="32" cy="32" r="16" fill="#0284c7" fill-opacity="0.25" />
    <text x="32" y="37" text-anchor="middle" font-size="17">⚡</text>
    <text x="62" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Ephemeral Previews</text>
    <text x="62" y="46" font-family="sans-serif" font-weight="400" font-size="11" fill="#94a3b8">On-demand PR branches</text>
  </g>

  <!-- Pill 2: Secure Cloud Sandboxes -->
  <g class="float-pill-2" transform="translate(375, 310)">
    <rect width="210" height="64" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle cx="32" cy="32" r="16" fill="#4f46e5" fill-opacity="0.25" />
    <text x="32" y="37" text-anchor="middle" font-size="17">🛡️</text>
    <text x="62" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Isolated Sandboxes</text>
    <text x="62" y="46" font-family="sans-serif" font-weight="400" font-size="11" fill="#94a3b8">Zero production data risk</text>
  </g>

  <!-- Pill 3: EaaS Orchestration -->
  <g class="float-pill-3" transform="translate(620, 310)">
    <rect width="210" height="64" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle cx="32" cy="32" r="16" fill="#9333ea" fill-opacity="0.25" />
    <text x="32" y="37" text-anchor="middle" font-size="17">🔄</text>
    <text x="62" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">EaaS Orchestration</text>
    <text x="62" y="46" font-family="sans-serif" font-weight="400" font-size="11" fill="#94a3b8">K8s, Docker &amp; Cloud VMs</text>
  </g>

  <!-- Pill 4: Cost &amp; TTL Automation -->
  <g class="float-pill-1" transform="translate(865, 310)">
    <rect width="210" height="64" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle cx="32" cy="32" r="16" fill="#059669" fill-opacity="0.25" />
    <text x="32" y="37" text-anchor="middle" font-size="17">💰</text>
    <text x="62" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Cost &amp; TTL Control</text>
    <text x="62" y="46" font-family="sans-serif" font-weight="400" font-size="11" fill="#94a3b8">Automated idle teardown</text>
  </g>
</svg>
